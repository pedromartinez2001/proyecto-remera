<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado del pago — TRAZO PY</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="payment.css"></head>
<body><main class="payment-result"><a class="logo" href="/">TRAZO<span>PY</span></a><section><p class="eyebrow">Resultado de Pagopar</p><h1 id="result-title">Consultando tu pago…</h1><div id="result-description"><p>Esperá un momento.</p></div><a class="button primary" href="/">Volver a la tienda</a></section></main>
<script>
async function check(){const p=new URLSearchParams(location.search),saved=JSON.parse(sessionStorage.getItem("last-pagopar-order")||"{}"),hash=p.get("hash")||p.get("hash_pedido")||saved.hash;if(!hash){show("No encontramos el pedido","Volvé a la tienda o escribinos por WhatsApp.");return}try{const r=await fetch("/.netlify/functions/payment-status?hash="+encodeURIComponent(hash)),d=await r.json();if(!r.ok)throw new Error(d.error);show(d.title,d.paid?"¡Gracias! Tu pago fue confirmado y prepararemos tu pedido.":d.cancelled?"El pedido fue cancelado. Podés volver a intentarlo.":"El pago todavía figura pendiente. Algunos medios pueden tardar unos minutos.")}catch(e){show("No pudimos verificar el pago",e.message)}}function show(t,d){document.querySelector("#result-title").textContent=t;document.querySelector("#result-description").innerHTML="<p>"+d+"</p>"}check();
</script></body></html>
